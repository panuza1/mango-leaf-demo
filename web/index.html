<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mango Leaf AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5ed;color:#263c2a;font:16px system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:32px 18px}header{padding:28px;background:#234b33;color:white;border-radius:18px}h1{margin:0;font-size:clamp(28px,5vw,48px)}p{line-height:1.6}header p{margin-bottom:0;color:#e0ebd8}.tags{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tags span{background:white;border:1px solid #dae4d1;padding:10px 18px;border-radius:40px;font-weight:600}#status{padding:24px;background:white;border:1px solid #dae4d1;border-radius:12px}iframe{width:100%;height:850px;border:1px solid #dae4d1;border-radius:12px;background:white}footer{font-size:13px;color:#586c59;margin-top:16px}
</style>
</head>
<body><main><header><h1>Mango Leaf AI</h1><p>Mango leaf disease classification • 8 classes • Real model inference</p></header>
<div class="tags"><span>SVM</span><span>Custom CNN</span><span>GoogLeNet</span></div>
<div id="status" role="status">Inference service is not configured. Set the Gradio backend URL in config.js. No predictions are simulated.</div>
<iframe id="demo" title="Mango leaf classification demo" hidden></iframe>
<footer>Research prototype. Predictions are not guaranteed diagnoses.</footer>
</main><script src="config.js"></script><script>
const value=window.MANGO_BACKEND_URL;
if(value){try{const url=new URL(value);if(url.protocol!=="https:")throw new Error("HTTPS required");document.getElementById("demo").src=url.href;document.getElementById("demo").hidden=false;document.getElementById("status").hidden=true;}catch{document.getElementById("status").textContent="Invalid backend URL. Use a public HTTPS endpoint.";}}
</script></body></html>
